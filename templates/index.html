<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auxiliar de Correção para Contratos | Sanar Contábil</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --primary-color: #1a73e8;
            --secondary-color: #2c3e50;
            --success-color: #28a745;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #333333;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: var(--secondary-color);
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        .main-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .upload-section {
            border: 2px dashed #cbd5e0;
            background: #f8fafc;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 30px;
        }

        .actions {
            display: flex;
            justify-content: center;
        }

        .btn {
            padding: 18px 40px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            text-align: center;
        }

        .btn-gemini {
            background-color: var(--primary-color);
        }

        .btn-copy {
            background-color: var(--success-color);
            padding: 10px 20px;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .results-area {
            margin-top: 40px;
            border-top: 2px solid #edf2f7;
            padding-top: 30px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 10px;
        }

        #resultado-content {
            background: #fdfdfd;
            padding: 30px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1.15rem;
            color: #2d3748;
            line-height: 1.8;
        }

        #resultado-content strong {
            color: #1a202c;
        }

        #resultado-content blockquote {
            border-left: 4px solid var(--primary-color);
            margin: 0;
            padding-left: 20px;
            color: #4a5568;
            font-style: italic;
        }

        #loader {
            display: none;
            text-align: center;
            margin: 20px 0;
            color: var(--primary-color);
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>Auxiliar de Correção para Contratos</h1>
            <p>Sanar Contábil S/C Ltda</p>
        </div>

        <div class="main-card">
            <form action="/analisar" method="post" enctype="multipart/form-data" onsubmit="showLoading()">
                <div class="upload-section">
                    <strong>Selecione o arquivo do contrato (.docx)</strong><br><br>
                    <input type="file" name="file" accept=".doc,.docx" required>
                </div>

                <div class="actions">
                    <button type="submit" name="engine" value="gemini" class="btn btn-gemini">
                        Analisar com Gemini
                    </button>
                </div>
            </form>

            <div id="loader">⌛ Processando análise e redigindo cláusulas...</div>

            {% if resultado %}
            <div class="results-area">
                <div class="results-header">
                    <h2>Relatório Técnico</h2>
                    <button class="btn btn-copy" onclick="copyToClipboard()">📋 Copiar Resultado</button>
                </div>

                <div id="resultado-content"></div>
                <script id="raw-data" type="text/plain">{{ resultado | safe }}</script>
            </div>
            {% endif %}
        </div>

        <div class="footer">
            &copy; 2024 Sanar Contábil S/C Ltda - Inteligência Documental
        </div>
    </div>

    <script>
        function showLoading() {
            document.getElementById('loader').style.display = 'block';
        }

        window.onload = function () {
            const rawData = document.getElementById('raw-data');
            if (rawData) {
                const content = rawData.textContent;
                document.getElementById('resultado-content').innerHTML = marked.parse(content);
            }
        };

        async function copyToClipboard() {
            const rawText = document.getElementById('raw-data').textContent;
            try {
                await navigator.clipboard.writeText(rawText);
                const btn = document.querySelector('.btn-copy');
                const originalText = btn.innerText;
                btn.innerText = "✅ Copiado!";
                btn.style.backgroundColor = "#155724";

                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = "";
                }, 2000);
            } catch (err) {
                alert('Erro ao copiar: ' + err);
            }
        }
    </script>

</body>

</html>
